name: System CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate system
        run: npm test

      - name: Read system version
        id: version
        shell: bash
        run: echo "version=$(node ./.github/workflows/get-version.js)" >> "$GITHUB_OUTPUT"

      - name: Set release manifest URLs
        if: github.ref == 'refs/heads/main'
        uses: microsoft/variable-substitution@v1
        with:
          files: './system.json'
        env:
          url: https://github.com/${{ github.repository }}
          manifest: https://github.com/${{ github.repository }}/releases/latest/download/system.json
          download: https://github.com/${{ github.repository }}/releases/latest/download/system.zip

      - name: Create system archive
        if: github.ref == 'refs/heads/main'
        run: zip -r system.zip assets lang module packs styles templates system.json README.md

      - name: Update latest release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: './system.json,./system.zip'
          artifactErrorsFailBuild: true
          name: Latest
          removeArtifacts: true
          replacesArtifacts: true
          tag: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: './system.json,./system.zip'
          artifactErrorsFailBuild: true
          name: Release ${{ steps.version.outputs.version }}
          removeArtifacts: true
          replacesArtifacts: true
          tag: ${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
